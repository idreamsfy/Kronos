# Kronos Tokenizer 微调配置 - 同花顺 (300033)
# 使用 Apple Silicon MPS (GPU) 加速

# 预训练模型路径
pretrained_tokenizer_path: "NeoQuasar/Kronos-Tokenizer-base"

# 数据集配置
dataset_type: "custom"  # 使用自定义数据集
data_dir: "./akshare_data"  # 数据目录
stock_codes: ["300033"]  # 同花顺股票代码
frequency: "daily"  # 日线数据

# 训练参数
epochs: 30
batch_size: 50  # 每个设备的批次大小
learning_rate: 0.0002
weight_decay: 0.01
warmup_ratio: 0.1

# 窗口配置
window_len: 100  # 输入窗口长度
pred_len: 20  # 预测长度

# 设备配置
device: "mps"  # 使用 Apple Silicon MPS (Metal Performance Shaders)
num_workers: 4  # 数据加载工作进程数

# 保存配置
save_dir: "./outputs/models/finetune_tokenizer_300033_mps"
save_steps: 100  # 每多少步保存一次
logging_steps: 10  # 每多少步记录一次日志

# 其他配置
seed: 42
use_comet: false  # 禁用 Comet ML
