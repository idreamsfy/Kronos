#This is a config for finetuning kronos on 688206 STAR Market stock data
#这是一份用于科创板股票688206微调kronos的配置

data:
  data_path: "../data/processed/kronos_SHSE_688206_daily_2021-12-28_2026-04-20.csv"
  lookback_window: 60
  predict_window: 10
  max_context: 512
  clip: 5.0
  # dataset split ratio
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0

training:
  # control the training epochs of tokenizer and basemodel
  tokenizer_epochs: 15
  basemodel_epochs: 10
  batch_size: 8
  log_interval: 50
  num_workers: 4
  seed: 42
  
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001
  
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  
  # gradient accumulation steps for tokenizer training
  accumulation_steps: 1

# model path configuration
model_paths:
  # pretrained model path
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"
  
  # experiment name - other paths will be generated based on this
  exp_name: "688206_daily_finetune"
  base_path: "outputs/finetuned_models"

  # the following paths will be generated based on exp_name, no need to modify manually
  # way 1: leave empty string, the system will generate the full path
  base_save_path: ""  # outputs/finetuned_models/688206_daily_finetune
  finetuned_tokenizer: ""  # outputs/finetuned_models/688206_daily_finetune/tokenizer/best_model
  
  # way 2: use template string, {exp_name} will be replaced with the actual experiment name
  # base_save_path: "outputs/finetuned_models/{exp_name}"
  # finetuned_tokenizer: "outputs/finetuned_models/{exp_name}/tokenizer/best_model"
  
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "688206_daily_prediction"
  description: "对科创板股票688206进行日K线数据微调训练"
  use_comet: false
  
  # control the training phase
  train_tokenizer: true
  train_basemodel: true
  
  # if true, skip the existing model training
  skip_existing: false

# device configuration
device:
  use_cuda: true
  device_id: 0
