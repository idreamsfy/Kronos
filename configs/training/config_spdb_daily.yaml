# Configuration for Kronos Fine-tuning on SPDB Daily Data
# Generated by convert_to_kronos_format.py

data:
  # Path to the converted data
  data_path: "data/kronos_SHSE_600000_daily_2021-04-19_2026-04-18.csv"
  lookback_window: 60      # Reduced for small dataset (was 512)
  predict_window: 10       # Reduced for small dataset (was 48)
  max_context: 512
  clip: 5.0
  # Dataset split ratio
  train_ratio: 0.8
  val_ratio: 0.15
  test_ratio: 0.05

training:
  # Adjusted epochs based on data size
  tokenizer_epochs: 10
  basemodel_epochs: 5
  batch_size: 8
  log_interval: 10
  num_workers: 0  # Set to 0 for Windows compatibility
  seed: 42
  
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001
  
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  
  # Gradient accumulation steps
  accumulation_steps: 1

# Model path configuration
model_paths:
  # Use pre-trained models from Hugging Face
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"
  
  # Experiment name and save paths
  exp_name: "spdb_daily_finetune"
  base_path: "outputs/finetuned_models"
  
  # Auto-generated paths (leave empty for auto-generation)
  base_save_path: ""
  finetuned_tokenizer: ""
  
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "spdb_daily_prediction"
  description: "Fine-tuning on SPDB daily data"
  use_comet: false
